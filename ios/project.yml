name: Lull
options:
  bundleIdPrefix: com.liamwinckel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Lull:
    type: application
    platform: iOS
    sources:
      - path: Lull
        excludes:
          - "Web/**"
      - path: Lull/Web
        type: folder
        buildPhase: resources
      - path: Shared
    info:
      path: Lull/Info.plist
      properties:
        CFBundleDisplayName: Lull
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Lull can read your mindful minutes to show your progress.
        NSHealthUpdateUsageDescription: Lull saves your completed sessions to Apple Health as Mindful Minutes.
        CFBundleURLTypes:
          - CFBundleURLName: com.liamwinckel.lull
            CFBundleURLSchemes: [lull]
    entitlements:
      path: Lull/Lull.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.liamwinckel.lull]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamwinckel.lull
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LullWidgets
  LullWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LullWidgets
      - path: Shared
    info:
      path: LullWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lull
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LullWidgets/LullWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.liamwinckel.lull]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamwinckel.lull.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
